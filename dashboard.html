<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<link rel="icon" type="image/png" href="images/favicon.png">   
<title>Dashboard WSB Logistics</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background:#1b1b1b; }
h1 { text-align:center; }
p {text-align: center}
#sheetContainer { display:none; margin-top:20px; }
#loginContainer { max-width:400px; margin:50px auto; padding:20px; background:#fff; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.2); text-align:center; }
input { width:80%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px; }
button { padding:10px 20px; border:none; border-radius:5px; background:#333; color:#fff; cursor:pointer; }
iframe { width:100%; height:600px; border:none; border-radius:5px; }
</style>
</head>
<body>


<h1 style="color: #f0c040;">Panel zgłoszeń WSB </h1>
<a href="index.html"><h1 style="color: #f0c040;">Strona Główna</h1></a>

<div id="loginContainer">
    <p>Wpisz hasło, aby uzyskać dostęp do zgłoszeń:</p>
    <input type="password" id="password" placeholder="Hasło">
    <br>
    <button onclick="checkPassword()">Zaloguj</button>
</div>

<div id="sheetContainer">
    <p style="text-align:center;">Witaj adminie! Oto zgłoszenia:</p>
    <!-- Podmień link na swój arkusz Google Sheets -->
    <iframe src="https://docs.google.com/spreadsheets/d/1Mewza5Yh8fkO5w3D0GKoj1U3qVAROsLAN-BbPl8G6QM/edit?usp=sharing"></iframe>
</div>

<script>
const correctPassword = "wsbthebest"; // <-- ustaw tu swoje hasło

function checkPassword(){
    const input = document.getElementById("password").value;
    if(input === correctPassword){
        document.getElementById("loginContainer").style.display = "none";
        document.getElementById("sheetContainer").style.display = "block";
    } else {
        alert("Niepoprawne hasło!");
        document.getElementById("password").value = "";
    }
}
</script>

<footer>
    <p style="color: white;">© 2025 WSB Logistics — Made by xGasparr</p>
</footer>

<script src="script.js"></script>

</body>
</html>
