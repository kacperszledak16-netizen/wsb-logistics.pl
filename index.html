    <style>
        /* Globalne style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0c040;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            flex-direction: column;
        }

        /* Styl dla napisu */
        .title {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 20px; /* Odstęp między napisem a GIF-em */
        }

        /* Styl dla GIF-a */
        .gif-container img {
            width: 300px; /* Możesz dostosować szerokość GIF-a */
            height: auto;
        }
    </style>
</head>
<body>
    <div class="title">
        <h2>Strona WSB LOGISTICS w trakcie konstrukcji</h2>
    </div>  
    <div class="gif-container">
        <img src="truckload.gif" alt="Loading">
    </div>
