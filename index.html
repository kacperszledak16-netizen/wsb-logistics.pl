<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zimowa strona</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom, #1e3c72, #2a5298); /* zimowe niebo */
    height: 100vh;
    overflow: hidden;
    font-family: sans-serif;
    color: white;
    text-align: center;
  }

  header, section, footer {
    padding: 40px 20px;
  }

  section {
    max-width: 800px;
    margin: 20px auto;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
  }

  h1, h2 {
    margin: 0 0 20px 0;
  }

  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #06b6d4;
    color: white;
    cursor: pointer;
    font-size: 16px;
    margin: 10px;
  }

  img {
    max-width: 100%;
    border-radius: 12px;
  }

  /* Śnieg */
  .snowflake {
    position: absolute;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.8;
  }
</style>
</head>
<body>

<header>
  <h1>Witamy w zimowej krainie ❄️</h1>
</header>

<section>
  <h2>O nas</h2>
  <p>Ta sekcja wygląda zimowo dzięki padającemu śniegowi.</p>
  <button>Kliknij mnie</button>
</section>

<section>
  <h2>Galeria</h2>
  <img src="https://via.placeholder.com/600x300.png?text=Zima" alt="Zima">
</section>

<footer>
  <p>© 2025 Zimowa strona</p>
</footer>

<script>
  // --- Konfiguracja śniegu ---
  const SNOW_COUNT = 250; // liczba płatków
  const minSize = 2;      // minimalny rozmiar px
  const maxSize = 6;      // maksymalny rozmiar px
  const minSpeed = 15;     // minimalna prędkość px/frame
  const maxSpeed = 25;     // maksymalna prędkość px/frame

  for(let i=0; i<SNOW_COUNT; i++){
    const snow = document.createElement('div');
    snow.classList.add('snowflake');

    // losowy rozmiar
    const size = Math.random() * (maxSize-minSize) + minSize;
    snow.style.width = size + 'px';
    snow.style.height = size + 'px';

    // losowa pozycja X
    snow.style.left = Math.random() * window.innerWidth + 'px';
    // start nad ekranem
    snow.style.top = -10 - Math.random()*200 + 'px';

    document.body.appendChild(snow);

    // losowa prędkość
    const speed = Math.random() * (maxSpeed - minSpeed) + minSpeed;

    // funkcja spadania
    function fall() {
      let top = parseFloat(snow.style.top);
      if(top < window.innerHeight){
        // lekki ruch na boki, aby wyglądało naturalnie
        const sway = Math.sin(top/50) * 1.5;
        snow.style.top = top + speed + 'px';
        snow.style.left = parseFloat(snow.style.left) + sway + 'px';
        requestAnimationFrame(fall);
      }
      // po osiągnięciu dołu płatek pozostaje na miejscu
    }
    fall();
  }
</script>

</body>
</html>
