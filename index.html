<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zimowa strona</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(to bottom, #1e3c72, #2a5298); /* zimowe niebo */
    height: 100vh;
    overflow: hidden;
    font-family: sans-serif;
    color: white;
    text-align: center;
  }

  header, section, footer {
    padding: 40px 20px;
  }

  section {
    max-width: 800px;
    margin: 20px auto;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
  }

  h1, h2 {
    margin: 0 0 20px 0;
  }

  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #06b6d4;
    color: white;
    cursor: pointer;
    font-size: 16px;
    margin: 10px;
  }

  img {
    max-width: 100%;
    border-radius: 12px;
  }

  
  }
</style>
</head>
<body>

<header>
  <h1>Witamy w zimowej krainie ❄️</h1>
</header>

<section>
  <h2>O nas</h2>
  <p>Ta sekcja wygląda zimowo dzięki padającemu śniegowi.</p>
  <button>Kliknij mnie</button>
</section>

<section>
  <h2>Galeria</h2>
  <img src="https://via.placeholder.com/600x300.png?text=Zima" alt="Zima">
</section>

<footer>
  <p>© 2025 Zimowa strona</p>
</footer>

<script>
(function() {
  // --- Dodaj CSS dla płatków ---
  const style = document.createElement('style');
  style.textContent = `
    .snowflake {
      position: absolute;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
    }
  `;
  document.head.appendChild(style);

  // --- Konfiguracja ---
  const SNOW_COUNT = 200;
  const minSize = 2;
  const maxSize = 8;
  const minSpeed = 1;
  const maxSpeed = 5;

  for(let i=0; i<SNOW_COUNT; i++){
    const snow = document.createElement('div');
    snow.classList.add('snowflake');

    // Losowy rozmiar i przezroczystość
    const size = Math.random() * (maxSize - minSize) + minSize;
    snow.style.width = size + 'px';
    snow.style.height = size + 'px';
    snow.style.opacity = Math.random() * 0.5 + 0.5; // 0.5 - 1

    // Losowa pozycja startowa
    snow.style.left = Math.random() * window.innerWidth + 'px';
    snow.style.top = -10 - Math.random() * 300 + 'px';

    document.body.appendChild(snow);

    // Prędkość zależna od rozmiaru (małe szybciej, duże wolniej)
    const speed = maxSpeed - size/2 + Math.random();

    // Ruch w bok (wir)
    const swayAmplitude = Math.random() * 3 + 1; // 1-4 px
    const swayFrequency = Math.random() * 0.05 + 0.01; // różne częstotliwości

    (function fall() {
      let top = parseFloat(snow.style.top);
      if(top < window.innerHeight){
        const sway = Math.sin(top * swayFrequency) * swayAmplitude;
        snow.style.top = top + speed + 'px';
        snow.style.left = parseFloat(snow.style.left) + sway + 'px';
        requestAnimationFrame(fall);
      }
      // po osiągnięciu dołu pozostaje w miejscu
    })();
  }
})();
</script>

</body>
</html>
