<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stały śnieg</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #1e3c72;
    position: relative;
    overflow: hidden;
  }

  .snowflake {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    pointer-events: none;
  }
</style>
</head>
<body>

<script>
  const SNOW_COUNT = 100; // ile kropek
  const maxSize = 6; // maksymalny rozmiar kropki
  const minSize = 2; // minimalny rozmiar

  for(let i=0; i<SNOW_COUNT; i++){
    const snow = document.createElement('div');
    snow.classList.add('snowflake');

    // losowa pozycja X
    const x = Math.random() * window.innerWidth;
    // losowa pozycja Y
    const y = Math.random() * window.innerHeight;
    // losowy rozmiar
    const size = Math.random() * (maxSize-minSize) + minSize;

    snow.style.left = x + 'px';
    snow.style.top = y + 'px';
    snow.style.width = size + 'px';
    snow.style.height = size + 'px';

    document.body.appendChild(snow);
  }
</script>

</body>
</html>
